seed: 42
device: null

reference:
  electrode_csv: /path/to/reference_electrodes.csv

source_data:
  directory: /path/to/source_dataset_mat_files
  eeg_key: X
  labels_key: Y
  channel_order_file: /path/to/source_channel_order.txt
  file_pattern: "*.mat"

graph:
  head_radius_cm: 10.0
  gaussian_sigma_cm: 5.0
  threshold: 0.001
  add_self_loops: true

model:
  num_samples: 1000
  hidden_features: 128

training:
  min_masked_channels: 12
  max_masked_channels: 15
  validation_subject_fraction: 0.2
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 300
  patience: 15

output:
  directory: outputs/training
